hl7_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'fhirdb') }}"
      user: "{{ env_var('DB_USER', 'fhiruser') }}"
      password: "{{ env_var('DB_PASSWORD', 'fhirpassword') }}"
      schema: analytics
      threads: 4
